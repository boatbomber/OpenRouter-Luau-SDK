name: Update SDK

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-sdk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Download OpenAPI specification
        run: |
          curl -o input/openrouter.openapi.yaml \
            https://raw.githubusercontent.com/OpenRouterTeam/typescript-sdk/refs/heads/main/.speakeasy/in.openapi.yaml

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          pip install -r generator/requirements.txt

      - name: Install Rokit
        if: steps.changes.outputs.has_changes == 'true'
        uses: CompeyDev/setup-rokit@v0.1.2
        with:
          cache: true

      - name: Generate SDK
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          python -m generator -i input/openrouter.openapi.yaml -o src/

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          base: main
          branch: "update-sdk-$(date +%Y%m%d-%H%M%S)"
          sign-commits: true
          commit-message: "chore: update SDK from latest OpenAPI specification"
          title: "chore: update SDK from latest OpenAPI specification"
          body: |
            This PR updates the SDK with the latest OpenAPI specification from OpenRouter.

            **Changes:**
            - Updated `input/openrouter.openapi.yaml` with the latest specification
            - Regenerated `src/types.luau` and `src/init.luau` from the updated specification

            This PR was automatically generated by the [Update SDK workflow](.github/workflows/update-sdk.yml).
          labels: |
            automated
            dependencies
          reviewers: "boatbomber"
          delete-branch: true

